name: Refresh FPL plan

# Runs on GitHub's machines, not yours. The Mac can be shut, you can be abroad, and
# the plan still rebuilds every morning and publishes to a real URL.
#
# 06:50 UTC is 07:50 Irish summer time. GitHub runs schedules in UTC and does not
# observe daylight saving, so this lands at 06:50 local in winter. Scheduled runs are
# also queued rather than exact, and can slip by several minutes when GitHub is busy.
on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch: {}        # lets you trigger a rebuild by hand from the Actions tab
  push:
    branches: [main]           # so a change to the model is proven, not assumed
    paths-ignore: ["README.md"]

permissions:
  # write, so the run can commit the prediction log back. Without that the tracker
  # is rebuilt from nothing every morning and thrown away, and the model is never
  # scored against what actually happened.
  contents: write
  pages: write
  id-token: write
  # so a failed build can open an issue. The build failed every morning for a
  # month after a dependency changed under it, and the only signal was a red tick
  # on a page nobody opens.
  issues: write

# Never let two rebuilds publish at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The default shallow clone cannot rebase onto origin, which
          # is exactly what the prediction-log commit below needs to do.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the plan
        env:
          # Set these as repository variables (Settings > Secrets and variables >
          # Actions > Variables) rather than editing them in here.
          FPL_ENTRY: ${{ vars.FPL_ENTRY }}
          # Space-separated for several leagues, e.g. "123456 789012".
          FPL_LEAGUE: ${{ vars.FPL_LEAGUE }}
          FPL_RIVALS: ${{ vars.FPL_RIVALS || '19' }}
          # 'template' starts from the most-owned legal fifteen; 'xp' from the model's.
          FPL_START: ${{ vars.FPL_START || 'template' }}
          # FPL has no endpoint for free transfers held, so set this as a repository
          # variable the week after you bank one, and back to 1 once it is spent.
          FPL_FREE_TRANSFERS: ${{ vars.FPL_FREE_TRANSFERS || '1' }}
          # What the plan is trying to win. 'season' takes the season total as the
          # objective and lets the monthly prizes follow; 'month' plays for the cheque.
          FPL_OBJECTIVE: ${{ vars.FPL_OBJECTIVE || 'season' }}
        run: |
          python -m fplm.cli plan \
            --refresh \
            --rivals "$FPL_RIVALS" \
            --free-transfers "${FPL_FREE_TRANSFERS:-1}" \
            --start "${FPL_START:-template}" \
            --objective "${FPL_OBJECTIVE:-season}" \
            ${FPL_ENTRY:+--entry "$FPL_ENTRY"} \
            ${FPL_LEAGUE:+--league $FPL_LEAGUE} \
            --out site/index.html
          # A plan that failed to build should fail the run rather than publish an
          # empty page over a good one.
          test -s site/index.html

      # A failed build leaves yesterday's page up, which is the right thing to do
      # and also the easiest thing to miss. Say so where it will be seen: one issue,
      # appended to on each further failure, closed by the next success.
      - name: Raise an issue if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily rebuild is failing — the live page is stale"
          body="The build failed on $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL

          Until it passes, the published plan is the last successful one and does not reflect the current squad, prices or fixtures. The log names the failing step or self-check."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the failure issue once the build passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily rebuild is failing — the live page is stale"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Building again as of $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          fi

      # The forecast is written down before each deadline and joined to the real
      # score afterwards. That record only means anything if it survives the run
      # that made it, so it is committed back to the repository.
      - name: Persist the prediction log
        run: |
          if [ -n "$(git status --porcelain predictions.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add predictions.json
            git commit -m "Record gameweek prediction and actuals [skip ci]"
            # Another run may have landed first; rebase rather than clobber it.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          else
            echo "prediction log unchanged"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
