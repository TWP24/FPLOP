name: Refresh FPL plan

# Runs on GitHub's machines, not yours. The Mac can be shut, you can be abroad, and
# the plan still rebuilds every morning and publishes to a real URL.
#
# 06:50 UTC is 07:50 Irish summer time. GitHub runs schedules in UTC and does not
# observe daylight saving, so this lands at 06:50 local in winter. Scheduled runs are
# also queued rather than exact, and can slip by several minutes when GitHub is busy.
on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch: {}        # lets you trigger a rebuild by hand from the Actions tab
  push:
    branches: [main]           # so a change to the model is proven, not assumed
    paths-ignore: ["README.md"]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two rebuilds publish at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the plan
        env:
          # Set these as repository variables (Settings > Secrets and variables >
          # Actions > Variables) rather than editing them in here.
          FPL_ENTRY: ${{ vars.FPL_ENTRY }}
          # Space-separated for several leagues, e.g. "123456 789012".
          FPL_LEAGUE: ${{ vars.FPL_LEAGUE }}
          FPL_RIVALS: ${{ vars.FPL_RIVALS || '19' }}
          # 'template' starts from the most-owned legal fifteen; 'xp' from the model's.
          FPL_START: ${{ vars.FPL_START || 'template' }}
        run: |
          python -m fplm.cli plan \
            --refresh \
            --rivals "$FPL_RIVALS" \
            --start "${FPL_START:-template}" \
            ${FPL_ENTRY:+--entry "$FPL_ENTRY"} \
            ${FPL_LEAGUE:+--league $FPL_LEAGUE} \
            --out site/index.html
          # A plan that failed to build should fail the run rather than publish an
          # empty page over a good one.
          test -s site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
